[package]
name = "gameboy-emulator"
version = "1.0.1"
edition = "2021"
authors = ["Joshua Clements"]
description = "A Game Boy DMG emulator written in Rust"
license = "TODO"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.21"
env_logger = "0.11.3"
lazy_static = "1.4.0"
sdl2 = "0.36.0"
bitflags = "2.9.4"
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
